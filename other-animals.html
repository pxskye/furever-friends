<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet!</title>
    <style>
   /* Fonts */
        @font-face {
            font-family: 'Poppins';
            src: url(FONT/Poppins/Poppins-Regular.ttf);
        }

        @font-face {
            font-family: 'Montserrat';
            src: url(FONT/Montserrat/Montserrat-VariableFont_wght.ttf);
        }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
            font-family: 'Poppins';
            background-color: #fbeff4;
            color: #0d0a0a;
            text-align: left;
            background-image: url('ABOUT US/ehe.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0 auto;
            cursor: url('ABOUT US/cat_paw.png'), auto;
        }

    header {
      position: relative;
      background-color: #ffecf3;
    }

    a {
      cursor: url('ABOUT US/cat_paw.png'), pointer;
    }

    /* Pink line under header */
    header::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background-color: #d0137b;
    }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 5px 10px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #d0137b;
        }

        .logo img {
            width: 170px;
            height: 100px;
        }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin-left: auto; /* Align to the right */
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: #000000;
      font-weight: 500;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #d0137b;
      color: white;
    }

        .container {
            display: flex;
            margin: 0 auto;
            margin-top: 50px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 20px;
        }
    
        /* Search bar */
        input[type="text"] {
            width:80%;
            box-sizing: border-box;
            border: 2px solid #d0137b;
            border-radius: 25px;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color: #d0137b;
            outline: none;
        }
    
        /* Section title */
        h2 {
            text-align: center;
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #333;
        }

        a {
            cursor: url('ABOUT US/cat_paw.png'), auto;
        }
    
        /* Cards */
        .pet-card {
            background: white;
            border: 2px solid pink;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 20px;
            width: 250px;
            display: inline-block;
            vertical-align: top;
            transition: transform 0.3s;
            cursor: url('ABOUT US/cat_paw.png'), auto;
            position: relative;
        }
        .pet-card:hover {
            transform: scale(1.05);
        }
        .pet-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .pet-info {
            padding: 15px;
        }
        .pet-info h3 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }
        .pet-info p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
    
        /* Available Tag */
        .available-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: gold;
            color: black;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 12px;
            border-radius: 5px;
        }
    
        /* Button */
        .pet-card button {
            margin-top: 10px;
            background-color: #d0137b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            cursor: url('ABOUT US/cat_paw.png'), auto;
            transition: background-color 0.3s;
        }
        .pet-card button:hover {
            background-color: #a0105e;
        }
    
        /* Hide class */
        .hide {
            display: none !important;
        }

        /* Modal Styles */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0; 
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.6); 
    align-items: center;
    justify-content: center;
}

.modal-content {
    background-color: #fff;
    margin: 15px;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 600px;
    box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    color: #d0137b;
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 30px;
    font-weight: bold;
    cursor: url('ABOUT US/cat_paw.png'), auto;
}
.close:hover {
    color: #a0105e;
}

/* Additional highlight class for names */
.bruno-highlight {
    color: #d0137b;
    font-weight: bold;
}

/* Call to action button inside modal */
.call-to-action {
    display: block;
    background-color: #d0137b;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    margin-top: 20px;
    text-decoration: none;
    font-weight: bold;
    transition: background-color 0.3s;
}
.call-to-action:hover {
    background-color: #a0105e;
}

.adopted-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #d0137b;
    color: white;
    padding: 5px 10px;
    font-weight: bold;
    font-size: 12px;
    border-radius: 5px;
}

        /* Fade-in and Slide-up Animation */
        .scroll-animated {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.7s ease-out, transform 0.7s ease-out;
        }

        .scroll-animated.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        /* Fade-in and Slide-up for List Items (Potential Stagger) */
        .scroll-animated-list {
            /* Optional styles for the container */
        }

        .scroll-animated-item {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }

        .scroll-animated-item.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        .scroll-animated-list.in-view .scroll-animated-item:nth-child(1) {
            transition-delay: 0.2s;
        }

        .scroll-animated-list.in-view .scroll-animated-item:nth-child(2) {
            transition-delay: 0.4s;
        }

        /* Zoom-in Animation */
        .scroll-zoom {
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .scroll-zoom.in-view {
            opacity: 1;
            transform: scale(1);
        }

footer {
      margin-top: 30px;
      background-color: #d0137b;
      color: #fff;
      padding: 15px;
      text-align: center;
    }

    </style>
    
    
</head>
<body>

    <body>
        <header>
            <nav>
                <div class="logo">
                    <a href="homepage.html">
                        <img src="HOME/OOP Logo.png" alt="FurEver Friends Logo"/>
                    </a>
                </div>
                <ul>
                    <li><a href="homepage.html">HOME</a></li>
                    <li><a href="our-animals.html">OUR ANIMALS</a></li>
                    <li><a href="about-us.html">ABOUT US</a></li>

    <input class="container scroll-animated" type="text" data-search placeholder="Search by name, age, breed, gender">

    <div class="scroll-animated-item">
        <h2>Available Pets</h2>
        <div data-available-container></div>
    </div>

    <div class="scroll-animated-item">
        <h2>Adopted Pets</h2>
        <div data-adopted-container></div>
    </div>

    <template data-available-template>
        <div class="pet-card" data-pet-name="">
            <span class="available-tag">Available!</span> <!-- yellow tag -->
            <img data-image src="" alt="">
            <div class="pet-info">
                <h3 data-name></h3>
                <p>Age: <span data-age></span></p>
                <p>Gender: <span data-gender></span></p>
                <p>Breed: <span data-breed></span></p>
                <button onclick="showModal(this.parentNode.parentNode.dataset.petName)">View Details</button>
            </div>
        </div>
    </template>
    

    <template data-adopted-template>
        <div class="pet-card adopted" data-pet-name="">
            <img data-image src="" alt="" style="width: 100px; height: 100px; object-fit: cover;">

            <p>Age: <span data-age></span></p>
            <p>Gender: <span data-gender></span></p>
            <p>Breed: <span data-breed></span></p>
            <span class="adopted-tag">Adopted</span>
            <button onclick="showModal(this.parentNode.dataset.petName)" disabled>View Details</button>
        </div>
    </template>

        <div id="modal-content" class="modal-content">
        </div>
    </div>

    <footer>
        <p>&copy; 2025 FurEver Friends. All Rights Reserved.</p>
    </footer>

    <script>
            document.addEventListener('DOMContentLoaded', function () {
            const animatedElements = document.querySelectorAll(
                '.scroll-animated, .scroll-animated-item, .scroll-zoom');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        entry.target.setAttribute('data-in-view', 'true');
                    } else if (entry.target.getAttribute('data-in-view') === 'true') {
                        entry.target.classList.remove('in-view');
                        entry.target.removeAttribute('data-in-view');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -20% 0px'
            });

            animatedElements.forEach(element => {
                observer.observe(element);
            });
        });

        const availableContainer = document.querySelector("[data-available-container]");
        const adoptedContainer = document.querySelector("[data-adopted-container]");
        const availableTemplate = document.querySelector("[data-available-template]");
        const adoptedTemplate = document.querySelector("[data-adopted-template]");
        const searchInput = document.querySelector("[data-search]");
        const modal = document.getElementById('modal');

        let users = [];
        const googleFormLink = "https://docs.google.com/forms/d/e/1FAIpQLSf-JZz-gcgPkx0c1A8aJh2aNS1WltIjIZPwrN7kV2j5MbdiWg/formResponse";

        searchInput.addEventListener("input", (e) => {
            const value = e.target.value.toLowerCase();
            users.forEach(user => {
                const isVisible =
                    user.Age.toLowerCase().includes(value) ||
                    user.Gender.toLowerCase().includes(value) ||
                    user.Breed.toLowerCase().includes(value) ||
                    user.Name.toLowerCase().includes(value);
                user.element.classList.toggle("hide", !isVisible);
            });
        });

        fetch("others-info.json")
            .then(res => res.json())
            .then(data => {
                users = data.map(user => {
                    let card;
                    let container;
                    let template;

                    template = availableTemplate;
container = user.Adopted ? adoptedContainer : availableContainer;


                    card = template.content.cloneNode(true).children[0];
                    card.dataset.petName = user.Name; // Store the name as a data attribute

                    const availableTag = card.querySelector(".available-tag");

if (user.Adopted) {
    availableTag.remove(); // remove "Available!" tag
    const adoptedTag = document.createElement('span');
    adoptedTag.classList.add('adopted-tag');
    adoptedTag.textContent = "Adopted!";
    card.appendChild(adoptedTag); // add "Adopted!" tag
} else {
    availableTag.textContent = "Available!";
    availableTag.style.backgroundColor = "gold";
}

                    const age = card.querySelector("[data-age]");
                    const gender = card.querySelector("[data-gender]");
                    const breed = card.querySelector("[data-breed]");
                    const name = card.querySelector("[data-name]");
                    const image = card.querySelector("[data-image]");

                    age.textContent = user.Age;
                    gender.textContent = user.Gender;
                    breed.textContent = user.Breed;
                    name.textContent = user.Name;

                    if (user.imageUrl) {
                        image.src = user.imageUrl;
                        image.alt = `${user.Breed} - ${user.Age} - <span class="math-inline">\{user\.Name\} \(</span>{user.Gender})`;
                    } else {
                        image.style.display = 'none';
                    }

                    container.append(card);
                    return { Age: user.Age, Gender: user.Gender, Breed: user.Breed, Name: user.Name, Img: user.imageUrl, element: card };
                });
            });

        function showModal(petName) {
            const pet = users.find(user => user.Name === petName);
            if (!pet) {
                console.error(`Pet with name "${petName}" not found.`);
                return;
            }

            let content = `<span class="close" onclick="closeModal()">&times;</span>`;

            switch (pet.Name) {

                    break;
                    case 'Ruperto the frog':
                    content += `

                        </p>

                        <p><strong>Age:</strong> 1 year old (Still in his prime hopping years!)</p>
                        <p><strong>Gender:</strong> Male</p>
                        <p><strong>Color:</strong> Leafy Green with a Crisp White Belly</p>
                        <div class="personality-icons">
                            <span class="personality-icon">🌿</span> Loves a Humid Habitat<br>

                        <p class="good-to-know">

                        <p class="meet-ruperto">

                        </p>
                    `;
                    break;
                    case 'Roberto':
                    content += `
