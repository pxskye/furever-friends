<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Grooming Infographic</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Fonts */
        @font-face {
            font-family: 'Poppins';
            src: url(FONT/Poppins/Poppins-Regular.ttf);
        }

        @font-face {
            font-family: 'Montserrat';
            src: url(FONT/Montserrat/Montserrat-VariableFont_wght.ttf);
        }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
            font-family: 'Poppins';
            background-color: #fbeff4;
            color: #0d0a0a;
            text-align: center;
            background-image: url('ABOUT US/ehe.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            cursor: url('ABOUT US/cat_paw.png'), auto;
        }

    header {
      position: relative;
      background-color: #ffecf3;
    }

    /* Pink line under header */
    header::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background-color: #d0137b;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #d0137b;
    }

        .logo img {
            width: 170px;
            height: 100px;
        }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 5px 10px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin-left: auto; /* Align to the right */
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: #000000;
      font-weight: 500;
      padding: 10px 15px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #d0137b;
      color: white;
    }
    .infographic-container {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .infographic-container img {
      width: 75%;
      height: 90%;
      border-radius: 10px;
    }

    footer {
      margin-top: 50px;
      background-color: #d0317b;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">
        <a href="homepage.html">
          <img src="HOME/OOP Logo.png" alt="FurEver Friends Logo">
        </a>
      </div>
      <ul>
        <li><a href="homepage.html">HOME</a></li>
        <li><a href="our-animals.html">OUR ANIMALS</a></li>
        <li><a href="about-us.html">ABOUT US</a></li>
        <li><a href="help.html">HELP</a></li>
        <li><a href="contactus.html">CONTACT US</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="infographic-container">
      <h1 style="margin: 25px 0 50px 0;">BIRD GROOMING INFOGRAPHIC</h1>
      <img src="GROOMING INFOGRAPHICS/bird-infographics.jpg" alt="Bird Grooming Infographic">
    </section>
  </main>

  <footer>
    &copy; 2025 FurEver Friends. All rights reserved.
  </footer>

</body>
</html>
